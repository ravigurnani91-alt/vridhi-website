<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vridhi Media Tools</title>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#12181f;--muted:#5b6672;--brand:#0f7a53;--border:#e3e7eb;--accent:#eaf6f0;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1310;--card:#161c19;--text:#eef3f0;--muted:#9aa8a1;--brand:#28c589;--border:#26302b;--accent:#132620;}}
:root[data-theme="dark"]{--bg:#0e1310;--card:#161c19;--text:#eef3f0;--muted:#9aa8a1;--brand:#28c589;--border:#26302b;--accent:#132620;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
header{padding:24px 20px 8px;text-align:center;}
header p.tag{margin:0;color:var(--muted);font-size:.78rem;}
header h1{margin:6px 0;font-size:1.5rem;}
header p.desc{margin:0;color:var(--muted);font-size:.92rem;}
.wrap{max-width:940px;margin:0 auto;padding:0 16px 60px;}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0;-webkit-overflow-scrolling:touch;}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.86rem;cursor:pointer;}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff;}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.subtab{padding:6px 12px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.8rem;cursor:pointer;}
.subtab.active{border-color:var(--brand);color:var(--brand);font-weight:600;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
.drop{border:2px dashed var(--border);border-radius:12px;padding:32px 16px;text-align:center;color:var(--muted);cursor:pointer;}
.drop:hover{border-color:var(--brand);}
input[type=file]{display:none;}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:12px 0;}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px;}
input[type=range]{width:150px;}
input[type=number],input[type=text]{width:90px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
select{padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
button.btn{background:var(--brand);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:.88rem;cursor:pointer;}
button.btn.secondary{background:transparent;color:var(--brand);border:1px solid var(--brand);}
button.btn:disabled{opacity:.5;cursor:not-allowed;}
.canvas-wrap{max-width:100%;overflow-x:auto;text-align:center;background:repeating-conic-gradient(#0000 0 25%,var(--accent) 0 50%) 0 0/20px 20px;border-radius:10px;padding:10px;}
canvas,video{max-width:100%;height:auto;border-radius:6px;}
.hint{font-size:.78rem;color:var(--muted);margin-top:8px;}
.note{font-size:.78rem;color:var(--muted);background:var(--accent);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
.filelist{font-size:.82rem;margin:8px 0;}
.filelist div{padding:4px 0;border-bottom:1px solid var(--border);}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px;}
.brand{color:var(--brand);font-weight:600;}
</style>
</head>
<body>
<header>
  <p class="tag"><a href="https://vridhi.in" style="color:var(--muted);text-decoration:none;">&larr; Back to Vridhi</a> &middot; Free Tools</p>
  <h1><span class="brand">Vridhi</span> Media Tools</h1>
  <p class="desc">Edit images, PDFs and video &mdash; entirely in your browser, nothing uploaded.</p>
</header>
<div class="wrap">
  <div class="tabs" id="mainTabs"></div>
  <div id="imageSection"></div>
  <div id="pdfSection" style="display:none;"></div>
  <div id="videoSection" style="display:none;"></div>
</div>
<footer>All processing happens locally on your device &mdash; files are never uploaded.<br>A free tool from <a href="https://vridhi.in" style="color:var(--brand);text-decoration:none;">Vridhi</a> &mdash; investing tools &amp; education for first-time investors.</footer>

<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const mainTabs=[{id:'image',label:'Image'},{id:'pdf',label:'PDF'},{id:'video',label:'Video'}];
const mainTabsEl=document.getElementById('mainTabs');
mainTabs.forEach((t,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=t.label;b.onclick=()=>showSection(t.id);mainTabsEl.appendChild(b);});
function showSection(id){
  [...mainTabsEl.children].forEach((b,i)=>b.classList.toggle('active',mainTabs[i].id===id));
  document.getElementById('imageSection').style.display=id==='image'?'block':'none';
  document.getElementById('pdfSection').style.display=id==='pdf'?'block':'none';
  document.getElementById('videoSection').style.display=id==='video'?'block':'none';
}
</script>
<script src="image-tools.js"></script>
<script src="pdf-tools.js"></script>
<script src="video-tools.js"></script>
</body>
</html>
